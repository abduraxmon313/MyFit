# Creates the fixed MyFit Android signing key ONCE and proposes it as a PR.
# The key file is protected by ANDROID_KEYSTORE_PASSWORD (repository secret);
# the password is never printed. Refuses to run if the key already exists.
name: Create Android keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEYSTORE: android/app/myfit-upload.p12
      BRANCH: ci/android-keystore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Checks
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret is missing"; exit 1
          fi
          if [ ${#ANDROID_KEYSTORE_PASSWORD} -lt 16 ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is shorter than 16 characters; use a long random password"; exit 1
          fi
          case "$ANDROID_KEYSTORE_PASSWORD" in
            *\\*) echo "::error::ANDROID_KEYSTORE_PASSWORD must not contain a backslash (\\)"; exit 1 ;;
          esac
          if [ -f "$KEYSTORE" ]; then
            echo "::error::$KEYSTORE already exists. It is never replaced automatically (installed apps depend on it)."; exit 1
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::Branch $BRANCH already exists (a key was created before). Merge or delete it first."; exit 1
          fi

      - name: Generate key (PKCS12, RSA 2048, 10000 days)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" -storetype PKCS12 \
            -alias myfit -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MyFit, O=MyFit, C=UZ" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEYSTORE_PASSWORD
          echo "### Android signing key created" >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias myfit \
            | grep -E "SHA1:|SHA256:" | sed 's/^\s*/- /' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push branch with the key
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -f "$KEYSTORE"
          git commit -m "Add MyFit Android signing key (password-protected PKCS12)"
          git push origin "$BRANCH"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch \`$BRANCH\` pushed; open a PR into main." >> "$GITHUB_STEP_SUMMARY"
