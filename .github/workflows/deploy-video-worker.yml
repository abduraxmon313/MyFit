# Deploys workers/video to Cloudflare (manual run only).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN       Cloudflare token, template "Edit Cloudflare Workers"
#   R2_ACCESS_KEY_ID           R2 API token access key (myfit-videos, Object Read & Write)
#   R2_SECRET_ACCESS_KEY       R2 API token secret
#   FIREBASE_SERVICE_ACCOUNT   whole service-account JSON (roles: Cloud Datastore User,
#                              Firebase Authentication Admin for SMS sign-in)
# Optional:
#   DEVSMS_API_TOKEN           devsms.uz API token (SMS sign-in, /auth/sms/*)
#   CALORIE_API_KEY            calorieapi.com REST key (barcode/food lookup, /food/*)
# Secret values are never printed; GitHub masks them in logs.
name: Deploy video Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-video-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/video
    env:
      # Not secret: same account id as in the R2 endpoint (wrangler.jsonc).
      CLOUDFLARE_ACCOUNT_ID: 7d6c72f2d7ccf971e52c251086f2bfa1
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/video/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck, tests, dry-run build
        run: npm run check

      - name: Validate secrets (values are not printed)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DEVSMS_API_TOKEN: ${{ secrets.DEVSMS_API_TOKEN }}
          CALORIE_API_KEY: ${{ secrets.CALORIE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; fi
          node scripts/prepare-secrets.mjs "$RUNNER_TEMP/worker-secrets.json"

      - name: Check Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler whoami

      - name: Deploy with secrets
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://myfit-video\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          if [ -z "$url" ]; then echo "::error::Deployed URL not found (is a workers.dev subdomain registered?)"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Remove secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"

      - name: Verify secret names on Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HAS_DEVSMS: ${{ secrets.DEVSMS_API_TOKEN != '' }}
          HAS_CALORIE: ${{ secrets.CALORIE_API_KEY != '' }}
        run: |
          names=$(npx wrangler secret list --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).map(x=>x.name).sort().join(" ")))')
          echo "Secrets on Worker: $names"
          required="FIREBASE_SERVICE_ACCOUNT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY"
          if [ "$HAS_DEVSMS" = "true" ]; then required="$required DEVSMS_API_TOKEN"; fi
          if [ "$HAS_CALORIE" = "true" ]; then required="$required CALORIE_API_KEY"; fi
          for n in $required; do
            echo " $names " | grep -q " $n " || { echo "::error::$n missing on Worker"; exit 1; }
          done

      - name: Smoke test deployed Worker
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Public Firebase web API key (already in lib/firebase_options.dart).
          FIREBASE_WEB_API_KEY: AIzaSyCnauQ_F9uxwJC9wsG3lEtY5oV76bRwPCM
          EXPECT_CALORIE_API: ${{ secrets.CALORIE_API_KEY != '' }}
        run: |
          sleep 5
          node scripts/smoke.mjs

      - name: Summary
        run: |
          {
            echo "### Video Worker deployed"
            echo ""
            echo "URL: \`${{ steps.deploy.outputs.url }}\`"
            echo ""
            echo "App URL lives in lib/config/app_config.dart (kVideoApiBaseUrl)."
          } >> "$GITHUB_STEP_SUMMARY"
