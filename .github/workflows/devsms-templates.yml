# Reads the DevSMS templates (GET /api/v1/templates, read-only) and shows
# their ID, name, status, placeholders and text in the run summary.
# Uses the DEVSMS_API_TOKEN repository secret; the token is never printed.
name: List DevSMS templates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: workers/video
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/video/package-lock.json

      - name: Install
        run: npm ci

      - name: Build script
        run: npx esbuild scripts/list-templates.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/list-templates.mjs" --log-level=warning

      - name: List templates
        env:
          DEVSMS_API_TOKEN: ${{ secrets.DEVSMS_API_TOKEN }}
        run: node "$RUNNER_TEMP/list-templates.mjs" "$GITHUB_STEP_SUMMARY"
